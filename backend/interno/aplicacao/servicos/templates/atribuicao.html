<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novo Questionário Atribuído</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4">
    <table
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background-color: #f4f4f4"
    >
      <tr>
        <td align="center" style="padding: 20px 0">
          <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="600"
            style="
              background-color: #ffffff;
              border-radius: 5px;
              overflow: hidden;
              font-family: Arial, sans-serif;
            "
          >
            <tr>
              <td style="padding: 40px 30px">
                <h2 style="margin: 0 0 20px 0; color: #333333; font-size: 24px">
                  Nova Atividade
                </h2>

                <p
                  style="
                    margin: 0 0 20px 0;
                    color: #555555;
                    font-size: 16px;
                    line-height: 1.5;
                  "
                >
                  Olá, {{.NomePaciente}}
                </p>
                <p
                  style="
                    margin: 0 0 30px 0;
                    color: #555555;
                    font-size: 16px;
                    line-height: 1.5;
                  "
                >
                  O profissional <strong>{{.NomeProfissional}}</strong> atribuiu um novo questionário para você: <br/>
                  <strong>{{.NomeInstrumento}}</strong>
                </p>

                <p
                  style="
                    margin: 0 0 30px 0;
                    color: #555555;
                    font-size: 16px;
                    line-height: 1.5;
                  "
                >
                  Acesse a plataforma para responder.
                </p>

                <table
                  border="0"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 0 auto"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#2196F3"
                      style="border-radius: 5px"
                    >
                      <a
                        href="{{.Link}}"
                        target="_blank"
                        style="
                          padding: 12px 25px;
                          border: 1px solid #2196F3;
                          border-radius: 5px;
                          font-family: Arial, sans-serif;
                          font-size: 16px;
                          color: #ffffff;
                          text-decoration: none;
                          display: inline-block;
                          font-weight: bold;
                        "
                      >
                        Acessar MindTrace
                      </a>
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 30px 0 0 0;
                    color: #999999;
                    font-size: 12px;
                    text-align: center;
                  "
                >
                  MindTrace Services
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
